<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coding Practice</title>
  </head>
  <body>
    <button id="toggleBtn">Click Me</button>
    <script>
      // 1. Sum of array elements
      function sumArray(arr) {
        return arr.reduce((sum, acc) => sum + acc, 0);
      }
      console.log(sumArray([1, 2, 3, 4, 5])); // 15

      // 2. Toggle button text on each click
      const toggleBtn = document.getElementById("toggleBtn");
      toggleBtn.addEventListener("click", () => {
        toggleBtn.innerText =
          toggleBtn.innerText === "Click Me" ? "Clicked !" : "Click Me";
      });
      // 3. Remove Duplicate from Array (defined ONCE, outside the click handler)
      function removeDuplicate(arr) {
        return [...new Set(arr)];
      }
      console.log(removeDuplicate([1, 1, 3, 5, 2, 3])); // [1, 3, 5, 2]

      //Count Words of String
      function countWords(str) {
        return str.split(" ").reduce((acc, word) => {
          acc[word] = (acc[word] || 0) + 1;
          return acc;
        }, {});
      }

      console.log(countWords("Ritik")); // { Ritik: 1 }
      console.log(countWords("hello world hello")); // { hello: 2, world: 1 }

      // fatch user with async / await and promise

      function fakeApiCall(userId) {
        return new Promise((resolve) => {
          setTimeout(() => {
            resolve({ id: userId, name: "User" + userId });
          }, 1000);
        });
      }

      async function fatchUser(userId) {
        try {
          const res = await fakeApiCall(userId);
          return res;
        } catch (error) {
          console.error("not able to fetch data");
          throw error;
        }
      }

      fatchUser(1).then(console.log);
    </script>
  </body>
</html>
